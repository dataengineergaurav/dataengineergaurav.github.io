---
layout: default
---
<article class="prose wiki-page">
  <header class="wiki-header">
    <p class="eyebrow">Wiki{% if page.tags and page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </header>
  {{ content }}
</article>
